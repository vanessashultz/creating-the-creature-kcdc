<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phidget Voltage Ratio Monitor</title>
  <script src="https://unpkg.com/phidget22/browser/phidget22.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f5f7;
      color: #1a1a1a;
    }

    h1 {
      font-size: 1.4rem;
    }

    /* Connection form */
    #connectionForm {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #connectionForm input {
      padding: 6px 8px;
      font-size: 1rem;
    }

    #connectionForm button {
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    #statusLine {
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    #statusLine .connected {
      color: #1a7f37;
      font-weight: bold;
    }

    #statusLine .disconnected {
      color: #b42318;
      font-weight: bold;
    }

    /* Voltage ratio visual */
    #ratioVisual {
      margin: 32px auto;
      max-width: 480px;
    }

    #ratioValue {
      font-size: 2.4rem;
      font-weight: bold;
      text-align: center;
      font-family: "Courier New", monospace;
    }

    #ratioBarTrack {
      width: 100%;
      height: 24px;
      background: #d9dce1;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 12px;
    }

    #ratioBarFill {
      height: 100%;
      width: 0%;
      background: #3a9d4f;
      transition: width 0.1s ease;
    }

    /* Raw state panel */
    #rawStatePanel {
      background: #10131a;
      color: #b6ffb6;
      padding: 16px;
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }

    section {
      margin-bottom: 28px;
    }

    label {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Phidget Voltage Ratio Monitor</h1>

  <section>
    <form id="connectionForm">
      <label>
        Server address
        <input id="serverAddress" type="text" value="localhost" />
      </label>
      <label>
        Port
        <input id="serverPort" type="number" value="8989" style="width: 80px;" />
      </label>
      <button id="connectButton" type="submit">Connect</button>
      <button id="disconnectButton" type="button" disabled>Disconnect</button>
    </form>
    <div id="statusLine">
      Status: <span id="statusText" class="disconnected">Disconnected</span>
    </div>
  </section>

  <section>
    <h2>Voltage Ratio</h2>
    <div id="ratioVisual">
      <div id="ratioValue">--</div>
      <div id="ratioBarTrack">
        <div id="ratioBarFill"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Raw Phidget State</h2>
    <div id="rawStatePanel">Waiting for connection...</div>
  </section>

  <script>
    // Elements
    const connectionForm = document.getElementById("connectionForm");
    const serverAddressInput = document.getElementById("serverAddress");
    const serverPortInput = document.getElementById("serverPort");
    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const statusText = document.getElementById("statusText");
    const ratioValue = document.getElementById("ratioValue");
    const ratioBarFill = document.getElementById("ratioBarFill");
    const rawStatePanel = document.getElementById("rawStatePanel");

    // Phidget objects — created fresh on each connection attempt
    let voltageRatioInput = null;

    // Keeps the raw state panel in sync with whatever we last observed
    function updateRawStatePanel(stateObject) {
      rawStatePanel.textContent = JSON.stringify(stateObject, null, 2);
    }

    function setConnectedUI(isConnected) {
      statusText.textContent = isConnected ? "Connected" : "Disconnected";
      statusText.className = isConnected ? "connected" : "disconnected";
      connectButton.disabled = isConnected;
      disconnectButton.disabled = !isConnected;
      serverAddressInput.disabled = isConnected;
      serverPortInput.disabled = isConnected;
    }

    // Voltage ratios from this sensor type range roughly 0 - 1
    function setRatioVisual(ratio) {
      if (ratio === null || ratio === undefined) {
        ratioValue.textContent = "--";
        ratioBarFill.style.width = "0%";
        return;
      }

      ratioValue.textContent = ratio.toFixed(4);

      const clampedRatio = Math.min(Math.max(ratio, 0), 1);
      ratioBarFill.style.width = `${clampedRatio * 100}%`;
    }

    async function connectToPhidgetServer(address, port) {
      // phidget22 attaches itself to window as `phidget22`
      const connection = new phidget22.NetworkConnection({
        hostname: address,
        port: port,
        onError: (code, message) => updateRawStatePanel({ connectionError: { code, message }}),
        onConnect: () => updateRawStatePanel({ status: "Connected"}),
        onDisconnect: () => {
          setConnectedUI(false);
          updateRawStatePanel({ status: "Disconnected from server" })
        }
      });

      connection.onError = (code, message) => {
        updateRawStatePanel({ connectionError: { code, message } });
      };

      connection.onDisconnect = () => {
        setConnectedUI(false);
        updateRawStatePanel({ status: "Disconnected from server" });
      };

      await connection.connect();

      voltageRatioInput = new phidget22.VoltageRatioInput();

      voltageRatioInput.isHubPortDevice = true;
      voltageRatioInput.hubPort = 0;

      // Any channel on any hub connected to the server — adjust if you need
      // to target a specific device/channel.
      voltageRatioInput.onAttach = () => {
        updateRawStatePanel({
          status: "Attached",
          deviceName: voltageRatioInput.deviceName,
          serialNumber: voltageRatioInput.deviceSerialNumber,
          channel: voltageRatioInput.channel,
          voltageRatio: voltageRatioInput.voltageRatio
        });
        setRatioVisual(voltageRatioInput.voltageRatio);
      };

      voltageRatioInput.onDetach = () => {
        updateRawStatePanel({ status: "Device detached" });
        setRatioVisual(null);
      };

      voltageRatioInput.onVoltageRatioChange = (voltageRatio) => {
        setRatioVisual(voltageRatio);
        updateRawStatePanel({
          status: "Voltage ratio change",
          deviceName: voltageRatioInput.deviceName,
          serialNumber: voltageRatioInput.deviceSerialNumber,
          channel: voltageRatioInput.channel,
          voltageRatio: voltageRatio,
          timestamp: new Date().toISOString()
        });
      };

      await voltageRatioInput.open(5000);

      setConnectedUI(true);
    }

    async function disconnectFromPhidgetServer() {
      if (voltageRatioInput) {
        try {
          await voltageRatioInput.close();
        } catch (error) {
          // Channel may already be closed — nothing to do here.
        }
        voltageRatioInput = null;
      }
      setRatioVisual(null);
      setConnectedUI(false);
      updateRawStatePanel({ status: "Disconnected" });
    }

    connectionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const address = serverAddressInput.value.trim();
      const port = parseInt(serverPortInput.value, 10);

      try {
        updateRawStatePanel({ status: "Connecting..." });
        await connectToPhidgetServer(address, port);
      } catch (error) {
        updateRawStatePanel({ connectionError: String(error) });
        setConnectedUI(false);
      }
    });

    disconnectButton.addEventListener("click", disconnectFromPhidgetServer);
  </script>

</body>
</html>
