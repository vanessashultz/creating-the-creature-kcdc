<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phidget Digital Output Control</title>
  <script src="https://unpkg.com/phidget22/browser/phidget22.js"></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f5f5f7;
      color: #1a1a1a;
    }

    h1 {
      font-size: 1.4rem;
    }

    /* Connection form */
    #connectionForm {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #connectionForm input {
      padding: 6px 8px;
      font-size: 1rem;
    }

    #connectionForm button {
      padding: 6px 14px;
      font-size: 1rem;
      cursor: pointer;
    }

    #statusLine {
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    #statusLine .connected {
      color: #1a7f37;
      font-weight: bold;
    }

    #statusLine .disconnected {
      color: #b42318;
      font-weight: bold;
    }

    /* Output control button */
    #outputButton {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      margin: 32px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      color: white;
      background: #8a8f98;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      transition: background-color 0.1s ease, transform 0.1s ease;
      user-select: none;
      border: none;
      cursor: pointer;
    }

    #outputButton:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    #outputButton.on {
      background: #3a9d4f;
    }

    #outputButton.off {
      background: #8a8f98;
    }

    #outputButton:active:not(:disabled) {
      transform: scale(0.94);
    }

    /* Raw state panel */
    #rawStatePanel {
      background: #10131a;
      color: #b6ffb6;
      padding: 16px;
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
    }

    section {
      margin-bottom: 28px;
    }

    label {
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>Phidget Digital Output Control</h1>

  <section>
    <form id="connectionForm">
      <label>
        Server address
        <input id="serverAddress" type="text" value="localhost" />
      </label>
      <label>
        Port
        <input id="serverPort" type="number" value="8989" style="width: 80px;" />
      </label>
      <button id="connectButton" type="submit">Connect</button>
      <button id="disconnectButton" type="button" disabled>Disconnect</button>
    </form>
    <div id="statusLine">
      Status: <span id="statusText" class="disconnected">Disconnected</span>
    </div>
  </section>

  <section>
    <h2>Digital Output</h2>
    <button id="outputButton" class="off" type="button" disabled>OFF</button>
  </section>

  <section>
    <h2>Raw Phidget State</h2>
    <div id="rawStatePanel">Waiting for connection...</div>
  </section>

  <script>
    // Elements
    const connectionForm = document.getElementById("connectionForm");
    const serverAddressInput = document.getElementById("serverAddress");
    const serverPortInput = document.getElementById("serverPort");
    const connectButton = document.getElementById("connectButton");
    const disconnectButton = document.getElementById("disconnectButton");
    const statusText = document.getElementById("statusText");
    const outputButton = document.getElementById("outputButton");
    const rawStatePanel = document.getElementById("rawStatePanel");

    // Phidget objects — created fresh on each connection attempt
    let digitalOutput = null;

    // Keeps the raw state panel in sync with whatever we last observed
    function updateRawStatePanel(stateObject) {
      rawStatePanel.textContent = JSON.stringify(stateObject, null, 2);
    }

    function setConnectedUI(isConnected) {
      statusText.textContent = isConnected ? "Connected" : "Disconnected";
      statusText.className = isConnected ? "connected" : "disconnected";
      connectButton.disabled = isConnected;
      disconnectButton.disabled = !isConnected;
      serverAddressInput.disabled = isConnected;
      serverPortInput.disabled = isConnected;
      outputButton.disabled = !isConnected;
    }

    function setOutputButtonVisual(isOn) {
      outputButton.classList.toggle("on", isOn);
      outputButton.classList.toggle("off", !isOn);
      outputButton.textContent = isOn ? "ON" : "OFF";
    }

    async function connectToPhidgetServer(address, port) {
      // phidget22 attaches itself to window as `phidget22`
      const connection = new phidget22.NetworkConnection({
        hostname: address,
        port: port,
        onError: (code, message) => updateRawStatePanel({ connectionError: { code, message }}),
        onConnect: () => updateRawStatePanel({ status: "Connected"}),
        onDisconnect: () => {
          setConnectedUI(false);
          updateRawStatePanel({ status: "Disconnected from server" })
        }
      });

      connection.onError = (code, message) => {
        updateRawStatePanel({ connectionError: { code, message } });
      };

      connection.onDisconnect = () => {
        setConnectedUI(false);
        updateRawStatePanel({ status: "Disconnected from server" });
      };

      await connection.connect();

      digitalOutput = new phidget22.DigitalOutput();

      digitalOutput.isHubPortDevice = true;
      digitalOutput.hubPort = 0;

      // Any channel on any hub connected to the server — adjust if you need
      // to target a specific device/channel.
      digitalOutput.onAttach = () => {
        updateRawStatePanel({
          status: "Attached",
          deviceName: digitalOutput.deviceName,
          serialNumber: digitalOutput.deviceSerialNumber,
          channel: digitalOutput.channel,
          state: digitalOutput.state
        });
        setOutputButtonVisual(digitalOutput.state === true);
      };

      digitalOutput.onDetach = () => {
        updateRawStatePanel({ status: "Device detached" });
        setOutputButtonVisual(false);
      };

      await digitalOutput.open(5000);

      setConnectedUI(true);
    }

    async function disconnectFromPhidgetServer() {
      if (digitalOutput) {
        try {
          await digitalOutput.close();
        } catch (error) {
          // Channel may already be closed — nothing to do here.
        }
        digitalOutput = null;
      }
      setOutputButtonVisual(false);
      setConnectedUI(false);
      updateRawStatePanel({ status: "Disconnected" });
    }

    connectionForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const address = serverAddressInput.value.trim();
      const port = parseInt(serverPortInput.value, 10);

      try {
        updateRawStatePanel({ status: "Connecting..." });
        await connectToPhidgetServer(address, port);
      } catch (error) {
        updateRawStatePanel({ connectionError: String(error) });
        setConnectedUI(false);
      }
    });

    disconnectButton.addEventListener("click", disconnectFromPhidgetServer);

    // Toggle the digital output each time the button is pressed
    outputButton.addEventListener("click", async () => {
      if (!digitalOutput) {
        return;
      }

      const nextState = !(digitalOutput.state === true);

      try {
        await digitalOutput.setState(nextState);
        setOutputButtonVisual(nextState);
        updateRawStatePanel({
          status: "State change",
          deviceName: digitalOutput.deviceName,
          serialNumber: digitalOutput.deviceSerialNumber,
          channel: digitalOutput.channel,
          state: nextState,
          timestamp: new Date().toISOString()
        });
      } catch (error) {
        updateRawStatePanel({ setStateError: String(error) });
      }
    });
  </script>

</body>
</html>
